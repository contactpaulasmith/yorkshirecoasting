<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect
    // Stores the full path in sessionStorage and redirects to the base
    var base = '/yorkshirecoasting';
    var path = window.location.pathname.replace(base, '') || '/';
    var search = window.location.search;
    var hash = window.location.hash;
    sessionStorage.setItem('spa_redirect', path + search + hash);
    window.location.replace(base + '/');
  </script>
</head>
<body></body>
</html>
